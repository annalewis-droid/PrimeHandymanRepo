<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Inquiry | Prime Handyman</title>
    
    <!-- Include the official Supabase CDN Script -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Include Cloudflare Turnstile Script -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    
    <style>
        /* Unified UI State Presentation Styles */
        .hidden { display: none !important; }
        .error-msg { color: #ef4444; margin-top: 10px; font-weight: 500; }
        .success-msg { color: #10b981; margin-top: 10px; font-weight: bold; }
        button:disabled, input:disabled, textarea:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Submit an Inquiry</h2>
        
        <!-- Native HTML5 Tier 1 Constraint Validation Enabled -->
        <form id="contactForm">
            <div>
                <label for="firstName">First Name *</label>
                <input type="text" id="firstName" required autocomplete="given-name">
            </div>
            <div>
                <label for="lastName">Last Name *</label>
                <input type="text" id="lastName" required autocomplete="family-name">
            </div>
            <div>
                <label for="email">Email Address *</label>
                <input type="email" id="email" required autocomplete="email">
            </div>
            <div>
                <label for="phone">Phone Number (Optional)</label>
                <input type="tel" id="phone" autocomplete="tel">
            </div>
            <div>
                <label for="message">Message *</label>
                <textarea id="message" required rows="4"></textarea>
            </div>
            
            <!-- Cloudflare Turnstile Anti-Bot Security Gatekeeper -->
            <div style="margin: 1.5rem 0;">
                <div class="cf-turnstile" 
                     data-sitekey="0x4AAAAAADfcMvl-zdJhdEK0" 
                     data-callback="onTurnstilePassed"             
                     data-expired-callback="onTurnstileExpired"></div>
            </div>
            
            <!-- Unified Single Action Button (Disabled by default until Turnstile clears) -->
            <button type="submit" id="submitBtn" disabled>Send Message</button>

            <!-- Clean, Singular UI State Feedback Elements -->
            <div id="successState" class="success-msg hidden">Thank you! Your inquiry has been received successfully.</div>
            <div id="failureState" class="error-msg hidden">Something went wrong. Please try again or contact support directly.</div>
        </form>
    </div>

    <script>
        // 1. Initialize Supabase Client Connection 
        // ⚠️ REMINDER: Replace these string placeholders with your real credentials before pushing to main!
        const SUPABASE_URL = 'https://kixyxjyizvragzaqyfsx.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_P4Eyho-PFpTu7zR5LB8dJQ_MPV82uXZ';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. DOM Elements Mapping
        const form = document.getElementById('contactForm');
        const submitBtn = document.getElementById('submitBtn');
        const successState = document.getElementById('successState');
        const failureState = document.getElementById('failureState');
        const formInputs = form.querySelectorAll('input, textarea, button');

        // 3. Required Turnstile Event Handler Callbacks
        function onTurnstilePassed(token) {
            // Unlock submission button when challenge clears successfully
            submitBtn.disabled = false;
        }

        function onTurnstileExpired() {
            // Re-lock the button if the token expires before submission
            submitBtn.disabled = true;
            if (typeof turnstile !== 'undefined') turnstile.reset();
        }

        // 4. Form Submission Event Handler
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // UI State: Submitting (Lock fields down to prevent duplicate clicks)
            toggleFormState(true);
            successState.classList.add('hidden');
            failureState.classList.add('hidden');

            // Data Contract Realignment: Concatenate individual fields to mandatory singular customer_name[cite: 1, 3]
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const customerName = `${firstName} ${lastName}`.trim();

            // Mapped identically to database constraints defined in your setup[cite: 1, 3]
            const payload = {
                brand_slug: 'prime-handyman', 
                customer_name: customerName,
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim() || null,
                message: document.getElementById('message').value.trim() || null
            };

            // Asynchronous Tier 2 Database Execution Block
            try {
                const { error } = await _supabase
                    .from('contact_submissions')
                    .insert([payload]);

                if (error) throw error;

                // UI State: Success (Clear form completely and notify user)
                form.reset();
                successState.classList.remove('hidden');

            } catch (err) {
                // UI State: Failure (Graceful degradation, safe dev logging)
                console.error('[Supabase Integration Error]:', err.message || err);
                failureState.classList.remove('hidden');
            } finally {
                // Release form input lock and prompt Turnstile reset for subsequent attempts
                toggleFormState(false);
                if (typeof turnstile !== 'undefined') turnstile.reset();
                submitBtn.disabled = true; // Force re-verification
            }
        });

        // Helper function to handle batch UI state switching
        function toggleFormState(disabled) {
            formInputs.forEach(input => {
                if (input.id !== 'submitBtn') input.disabled = disabled;
            });
            if (disabled) {
                submitBtn.disabled = true;
                submitBtn.textContent = 'Sending...';
            } else {
                submitBtn.textContent = 'Send Message';
            }
        }
    </script>
</body>
</html>
